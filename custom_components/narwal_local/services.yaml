reset_consumables:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: narwal_local
    items:
      selector:
        select:
          multiple: true
          translation_key: consumable
          options:
            - anti_winding_brush
            - clear_water_filter
            - cliff_sensor
            - curing_agent
            - detergent
            - dirty_water
            - dust_bag
            - dust_box
            - dust_container
            - dust_filter
            - heavy_detergent
            - inner_dust_box
            - mop
            - roller_brush
            - side_brush
            - side_distance_sensor
            - silver_ions
            - smart_module_filter
            - smart_module_sponge
            - station_bag
            - universal_wheel
            - wash_ribs
            - water_tank_sponge

clean_zone:
  target:
    entity:
      integration: narwal_local
      domain: vacuum
  fields:
    zones:
      required: true
      example: "[[1000, 2000, 3000, 4000]]"
      selector:
        object:
    repeats:
      default: 1
      selector:
        number:
          min: 1
          max: 3
          mode: box

clean_rooms:
  target:
    entity:
      integration: narwal_local
      domain: vacuum
  fields:
    rooms:
      required: true
      example: "[1, 3]"
      selector:
        object:
    repeats:
      default: 1
      selector:
        number:
          min: 1
          max: 3
          mode: box

add_no_go_zones:
  target:
    entity:
      integration: narwal_local
      domain: vacuum
  fields:
    zones:
      required: true
      example: "[[1000, 2000, 3000, 4000]]"
      selector:
        object:
    type:
      default: no_entry
      selector:
        select:
          translation_key: no_go_type
          options:
            - no_entry
            - no_vacuum
            - no_mop

delete_no_go_zones:
  target:
    entity:
      integration: narwal_local
      domain: vacuum
  fields:
    ids:
      example: "[1, 2]"
      selector:
        object:
