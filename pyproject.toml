[project]
name = "narwal-ha"
version = "0.1.0"
description = "Local Home Assistant integration for Narwal robot vacuums"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.10"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: talks to a real robot (needs NARWAL_HOST)"]
